<!DOCTYPE html>
<html lang="pt-br" id="html_root" style="min-width: 344px;" class="">
<head>
    <META NAME="KEYWORDS" CONTENT="html, css, javascript">
    <meta name="rating" content="general">

    <meta http-equiv="pragma" content="no-cache">
    <meta name="copyright" content="none">
    <meta charset="utf-8">
    <meta http-equiv="content-language" content="pt-br">

    <meta name="description" content="Lohk's">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="icon" type="image/x-icon" href="images/favicon.png">
    
    <title>Larinuim Dictionary</title>

    <link rel="stylesheet" href="/deps/css/default.css">
    <link rel="stylesheet" href="/deps/css/alignment.css">
    <link rel="stylesheet" href="/deps/css/classes.css">

    <link rel="stylesheet" href="css/dictionary.css">
    
    <script type="text/javascript" src="js/dict.js" defer></script>
    <script type="text/javascript" src="js/build.js" defer></script>
</head>
<body>
    <header>
        <div class="b-flex b-row b-between">
            <h1 class="f-avali c-center_h c-clickable" onclick="reset_all()">Larinuim Dictionary!</h1>
            <div class="c-center_h">
                <button id="lang-chooser">🇧🇷 BR</button>
            </div>
        </div>
    </header>

    <main>
        <input class="w100" placeholder="Search..." id="search-box"/>
        <hr>
        <section id="section-wotd-random">
            <div class="b-flex b-gap">
                <div class="c-flex c-noborder">
                    <div class="b-flex b-col b-center">
                        <h3 class="wotd-random-section-same-height" id="text-wotd">Word of the day</h3>
                    </div>
                    <div class="action-card" id="action-wotd">
                        <span class="title" icon="░░">...</span>
                        <div class="buttons">
                            <button tag="translations">📗</button>
                            <button tag="examples">📖</button>
                            <button tag="old_translations">📕</button>
                            <button tag="variations">🌟</button>
                            <button tag="old_variations">⭐</button>
                            <button tag="replaced_by">🔄</button>
                        </div>
                        <div class="detail">
                        </div>
                    </div>
                </div>
                <div class="c-flex c-noborder">
                    <button class="wotd-random-section-same-height" id="text-get-random">Get random word</button>
                    <div class="action-card" id="action-random" style="display: none;">
                        <span class="title" icon="░░">Click the button!</span>
                        <div class="buttons">
                            <button tag="translations">📗</button>
                            <button tag="examples">📖</button>
                            <button tag="old_translations">📕</button>
                            <button tag="variations">🌟</button>
                            <button tag="old_variations">⭐</button>
                            <button tag="replaced_by">🔄</button>
                        </div>
                        <div class="detail">
                        </div>
                    </div>
                </div>
                <button class="wotd-random-section-same-height" id="text-go-to-history">History of the language</button>
            </div>
        </section>
        <section id="section-all-words">
            <div class="b-flex b-col b-center">
                <h3 id="text-all-words">All words in the dictionary:</h3>
            </div>
            <div id="all-results" class="b-flex b-gap">

                <div class="action-card minimalist">
                    <span class="title" icon="░░">Loading...</span>
                    <div class="buttons">
                        <button tag="translations">📗</button>
                        <button tag="examples">📖</button>
                        <button tag="old_translations">📕</button>
                        <button tag="variations">🌟</button>
                        <button tag="old_variations">⭐</button>
                        <button tag="replaced_by">🔄</button>
                    </div>
                    <div class="detail">
                        <span>Meanings</span>
                    </div>
                </div>
                
                <div class="action-card minimalist">
                    <span class="title" icon="░░">Loading...</span>
                    <div class="buttons">
                        <button tag="translations">📗</button>
                        <button tag="examples">📖</button>
                        <button tag="old_translations">📕</button>
                        <button tag="variations">🌟</button>
                        <button tag="old_variations">⭐</button>
                        <button tag="replaced_by">🔄</button>
                    </div>
                    <div class="detail">
                        <span>Meanings</span>
                    </div>
                </div>
            </div>
        </section>
        <section id="section-search" style="display: none;">
            <div class="b-flex b-col b-center">
                <h3 id="text-your-search">Search results:</h3>
            </div>
            <section>
                <h4 id="text-modifiers-search">Possible analysis on the word:</h4>
                <ul id="modifiers-results">
                </ul>
            </section>
            <div id="scroll-results" class="b-flex b-gap">
            </div>
        </section>
    </main>

    <footer>
        <div class="b-flex b-col b-center">
            <span id="text-footer">Created by Lohk, 2026</span>
        </div>
    </footer>
</body>
</html>
